[package]
name = "etudier"
version = "0.14.4"
description = "Desktop shell for the étudier app"
authors = ["Codex"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "etudier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }

# Reminders through the macOS notification centre. Already part of the
# dependency tree (via tauri); only the classes used here are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSString", "NSUserNotification"] }

# Smaller, faster release binary: one codegen unit with LTO, size-tuned code,
# no unwinding tables and no debug symbols.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
